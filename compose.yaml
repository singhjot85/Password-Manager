services:
  app:
    build:
      context: .
    image: password-manager:local
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PASSWORD_REPOSITORY: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: password_manager
      POSTGRES_USER: password_manager
      POSTGRES_PASSWORD: password_manager

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: password_manager
      POSTGRES_USER: password_manager
      POSTGRES_PASSWORD: password_manager
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U password_manager -d password_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
